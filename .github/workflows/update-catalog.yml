name: Update retailer catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: retailer-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build catalog
        run: node scripts/build-catalog.mjs
      - name: Commit catalog changes
        run: |
          git config user.name "suited-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Auto-update retailer catalog"
            git push
          fi
