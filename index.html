<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5efe9">
  <title>Suited — Personal style, matched to you</title>
  <meta name="description" content="Suited is your personal shopping assistant for outfits matched to your size, style and budget.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <button class="brand" onclick="show('home')" aria-label="Suited home">
      <span class="brand-mark">S</span><span class="brand-word">SUITED</span>
    </button>
    <nav class="nav" aria-label="Main navigation">
      <button onclick="show('ask')">Ask Suited</button>
      <button onclick="show('saved')">Saved <span id="savedBadge" class="badge">0</span></button>
      <button onclick="show('profile')">My profile</button>
    </nav>
  </header>
  <main id="app" class="shell"></main>
  <footer class="site-footer">
    <div><strong>SUITED</strong><span>Personal style, matched to you.</span></div>
    <small>V1 beta · New Zealand · Sizes 6–20</small>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
